
<header
  class="sticky top-0 z-30 border-b border-zinc-200/80 bg-white/90 backdrop-blur-xl"
>
  <div
    class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3.5 sm:px-8 sm:py-4"
  >
    <!-- Brand -->
    <a
      routerLink="/"
      class="group flex min-w-0 shrink-0 items-center gap-3 no-underline"
      aria-label="CVBoost AI home"
    >
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-violet-600 text-white shadow-md shadow-violet-200/70 transition duration-200 group-hover:bg-violet-700 sm:h-11 sm:w-11 sm:rounded-2xl"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          />
          <path d="M14 2v6h6" />
          <path d="M8 13h5" />
          <path d="M8 17h3" />
          <path
            d="m17 12 .7 1.8 1.8.7-1.8.7L17 17l-.7-1.8-1.8-.7 1.8-.7z"
          />
        </svg>
      </div>

      <div class="min-w-0">
        <h1
          class="truncate text-base font-extrabold tracking-tight text-zinc-900 sm:text-lg"
        >
          CVBoost <span class="text-violet-600">AI</span>
        </h1>
        <p class="hidden text-xs text-zinc-500 sm:block">
          Your AI career assistant
        </p>
      </div>
    </a>

    <!-- Right navigation -->
    <div class="flex shrink-0 items-center gap-2 sm:gap-3">
      <!-- Free analysis badge -->
      <span
        class="hidden items-center gap-2 rounded-full border border-emerald-200/80 bg-emerald-50 px-3 py-2 text-xs font-semibold text-emerald-700 lg:inline-flex"
      >
        <span class="relative flex h-2 w-2">
          <span
            class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-50"
          ></span>
          <span
            class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"
          ></span>
        </span>
        Free resume analysis
      </span>

      @if (authService.isLoggedIn()) {
        <!-- History -->
        <a
          routerLink="/history"
          routerLinkActive="border-violet-200 bg-violet-50 text-violet-700"
          aria-label="Resume analysis history"
          title="Resume analysis history"
          class="inline-flex items-center gap-2 rounded-xl border border-zinc-200 bg-white px-3 py-2.5 text-sm font-semibold text-zinc-600 transition duration-200 hover:border-violet-200 hover:bg-violet-50 hover:text-violet-700 sm:px-3.5"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
            <path d="M12 7v5l4 2" />
          </svg>
          <span>History</span>
        </a>

        <!-- User profile -->
        <div
          class="flex min-w-0 items-center gap-2.5 border-l border-zinc-200 pl-3 sm:pl-4"
        >
          <div
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-violet-100 text-sm font-bold uppercase text-violet-700 ring-1 ring-violet-200 sm:h-10 sm:w-10"
            aria-hidden="true"
          >
            {{ (authService.user()?.name || 'U').charAt(0) }}
          </div>

          <div class="hidden min-w-0 sm:block">
            <p
              class="max-w-32 truncate text-sm font-semibold text-zinc-800"
            >
              {{ authService.user()?.name || 'My Account' }}
            </p>
            <p class="mt-0.5 text-xs text-zinc-500">
              Welcome back
            </p>
          </div>
        </div>

        <!-- Logout -->
        <button
          type="button"
          (click)="logout()"
          aria-label="Logout"
          title="Logout"
          class="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl border border-zinc-200 bg-white px-3 py-2.5 text-sm font-semibold text-zinc-600 transition duration-200 hover:border-red-200 hover:bg-red-50 hover:text-red-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-300 focus-visible:ring-offset-2 sm:px-3.5"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
            />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
          <span class="hidden sm:inline">Logout</span>
        </button>
      } @else {
        <!-- Guest navigation -->
        <a
          routerLink="/login"
          class="inline-flex items-center justify-center gap-2 rounded-xl bg-violet-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm shadow-violet-200/70 transition duration-200 hover:bg-violet-700 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-violet-400 focus-visible:ring-offset-2 sm:px-5"
        >
          Sign in
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </a>
      }
    </div>
  </div>
</header>
